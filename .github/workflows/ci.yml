name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal --component clippy,rustfmt
      - name: Test workspace
        run: cargo test --workspace --all-targets --locked
      - name: Lint workspace
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Check native macOS isolation backend
        if: runner.os == 'macOS'
        run: cargo clippy -p keel-isolate --all-targets --features libkrun-backend,vz-backend --locked -- -D warnings
      - name: Check exclusive trusted terminal
        if: runner.os == 'macOS'
        run: ./spikes/run-tty-proof.sh
      - name: Check formatting
        run: cargo fmt --all -- --check

  invariants:
    runs-on: ubuntu-24.04
    env:
      CI_REQUIRE_CARGO_DENY: "1"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal --component clippy,rustfmt
      - name: Install pinned invariant tools
        run: |
          cargo install --locked --version 15.0.0 tokei
          cargo install --locked --version 0.20.2 cargo-deny
      - name: Check trust-boundary invariants
        run: ./ci/phase0.sh
